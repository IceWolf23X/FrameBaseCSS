name: CSS distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-distribution:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked build dependencies
        run: npm ci

      - name: Install the pinned Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify distribution, HTML, accessibility, browser, and visual contracts
        run: npm run check

      - name: Upload browser diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
