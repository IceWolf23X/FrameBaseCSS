name: CSS distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-minified-css:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked build dependencies
        run: npm ci

      - name: Verify committed distribution files
        run: npm run check:css
